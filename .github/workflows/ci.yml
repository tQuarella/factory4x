# Merge and release gates. Protected file: changes need owner approval.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Merge gates
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run gates -- --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run gates -- --base "${{ github.event.before }}"
          else
            npm run gates -- --base origin/main
          fi

      - name: Build
        run: npm run build
        env:
          BUILD_VERSION: ${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}

      - name: Release smoke test (desktop + phone)
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: packages/client/dist
          retention-days: 14

  # Cloudflare Pages: main -> production (the public link), other branches -> preview URLs.
  # Runs only after every gate above passed. Needs repo secrets CLOUDFLARE_API_TOKEN
  # (Pages:Edit permission) and CLOUDFLARE_ACCOUNT_ID; skipped until they exist.
  deploy:
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PROJECT: factory4x
    steps:
      - name: Check Cloudflare secrets
        if: env.HAS_CF != 'true'
        run: echo "::warning::Cloudflare secrets not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true'
        with:
          name: site
          path: site
      - name: Ensure Pages project exists
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler pages project list | grep -qw "$PROJECT" || npx --yes wrangler pages project create "$PROJECT" --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
      - name: Smoke test the live deployment (desktop + phone)
        if: env.HAS_CF == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke
        env:
          CI: 'true'
          SMOKE_URL: ${{ steps.deploy.outputs.deployment-url }}
      - name: Report URL
        if: env.HAS_CF == 'true'
        run: echo "Deployed ${{ github.ref_name }} to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
